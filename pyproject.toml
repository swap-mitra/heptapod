[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heptapod"
version = "0.1.0"
description = "One uniform tool interface for LLM agents across REST, SOAP, and SQL backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The mock backends; also needed by the tests, which run each mock in-process.
mocks = ["fastapi>=0.141", "uvicorn>=0.54"]
dev = ["pytest>=8", "heptapod[mocks]"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
