[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heptapod"
version = "0.1.0"
description = "One uniform tool interface for LLM agents across REST, SOAP, and SQL backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
