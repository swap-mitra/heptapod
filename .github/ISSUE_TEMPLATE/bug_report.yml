name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or code that shows the problem.
      placeholder: |
        1. docker compose up -d --wait
        2. python -m agent "..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove any API keys or other secrets before pasting.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, LLM provider and model"
    validations:
      required: true
