name: Feature request
description: Suggest a new capability or backend.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Heptapod does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. For a new backend, name its protocol and auth scheme.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
